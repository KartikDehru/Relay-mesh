# Deploy this package as a standalone Railway service from the monorepo root
# using the root Dockerfile (recommended) OR Nixpacks with these settings.
#
# Each hop is a SEPARATE Railway project under an independent Railway account.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
